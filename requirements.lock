# requirements.lock — pinned dependency versions for deterministic builds.
#
# v11.7 (audit §10-3): the previous version of this file was a PLACEHOLDER —
# every pin was commented out, and its header claimed a
# .github/workflows/ci.yml that does not exist (and that Render never reads
# anyway). That was misleading: nothing was actually pinned.
#
# This file is now a REAL freeze of the verified working environment
# (Python 3.11.9 venv — the same tree that passes the full pytest suite and
# runs the live Telegram verification). It records exactly which versions
# were last verified together, for debugging "it worked yesterday" drift
# and for reproducing the environment locally:
#
#     python -m venv .venv && .venv/bin/pip install -r requirements.lock
#
# NOTE: Render's build uses requirements.txt (its buildCommand is explicit
# in render.yaml); Render does NOT auto-prefer lockfiles.
#
# Re-generate after every dependency change with:
#     .venv/bin/python -c "import importlib.metadata as md; print('\n'.join(sorted(f'{p.metadata[\"Name\"]}=={p.version}' for p in md.distributions())))"
# (includes test-only deps: pytest/pytest-asyncio/httpx/beautifulsoup4)

