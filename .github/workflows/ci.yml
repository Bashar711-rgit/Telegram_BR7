name: CI

# v14.8.0 (P8.4): بوابة اختبارات على كل push/PR — يدعم قرار الدمج الآمن
# إلى main (Render autoDeploy) قبل أي نشر. نفس إصدار Python الذي يشغّله
# Render (runtime.txt = 3.11.9).
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Compile check (all project sources)
        run: python -m compileall -q *.py unified_alerts scripts

      - name: Run test suite
        run: pytest -q
